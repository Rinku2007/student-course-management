<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students | Student Management</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="layout" id="studentsPage">
      <aside class="sidebar">
        <div class="brand">EduSaaS Admin</div>
        <a class="nav-item" href="/index.html">Dashboard</a>
        <a class="nav-item active" href="/students.html">Students</a>
        <a class="nav-item" href="/add-student.html">Add Student</a>
        <a class="nav-item" href="/courses.html">Courses</a>
        <a class="nav-item" href="/settings.html">Settings</a>
        <button class="nav-item" data-logout>Logout</button>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="search-box"><input id="searchInput" placeholder="Search by name, email, course..." /></div>
          <div class="top-actions">
            <a class="btn alt" href="/signup.html">SignUp</a>
            <a class="btn alt" href="/login.html">Login</a>
            <button class="toggle" id="themeToggle"></button>
            <button class="btn danger" data-logout>Logout</button>
          </div>
        </div>
        <div class="page-title">
          <h2>Students</h2>
          <div class="date-badge" id="dateBadge"></div>
        </div>
        <div class="filter-row">
          <select id="statusFilter">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <section class="cards" id="studentsGrid"></section>
      </main>
    </div>

    <div class="modal" id="editStudentModal">
      <div class="panel modal-card">
        <div class="modal-head">
          <h3>Edit Student</h3>
          <button class="icon-btn" id="closeEditModal" type="button">X</button>
        </div>
        <form id="editStudentForm">
          <input type="text" name="name" id="editName" placeholder="Name" required />
          <input type="email" name="email" id="editEmail" placeholder="Email" required />
          <input type="number" name="age" id="editAge" placeholder="Age" required />
          <select name="course" id="editCourse" required></select>
          <select name="status" id="editStatus" required>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
          <div class="form-actions">
            <button class="btn alt" id="cancelEditModal" type="button">Cancel</button>
            <button class="btn" type="submit">Update</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/students.js"></script>
  </body>
</html>
