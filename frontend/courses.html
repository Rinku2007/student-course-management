<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses | Student Management</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">EduSaaS Admin</div>
        <a class="nav-item" href="/index.html">Dashboard</a>
        <a class="nav-item" href="/students.html">Students</a>
        <a class="nav-item" href="/add-student.html">Add Student</a>
        <a class="nav-item active" href="/courses.html">Courses</a>
        <a class="nav-item" href="/settings.html">Settings</a>
        <button class="nav-item" data-logout>Logout</button>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="search-box"><input id="courseSearchInput" placeholder="Search by course name, code, status..." /></div>
          <div class="top-actions">
            <a class="btn alt" href="/signup.html">SignUp</a>
            <a class="btn alt" href="/login.html">Login</a>
            <button class="toggle" id="themeToggle"></button>
            <button class="btn danger" data-logout>Logout</button>
          </div>
        </div>
        <div class="page-title"><h2>Courses</h2><div class="date-badge" id="dateBadge"></div></div>

        <section class="panel form-wrap" style="margin-bottom:16px;">
          <form id="addCourseForm">
            <input type="text" name="name" placeholder="Course Name" required />
            <input type="text" name="code" placeholder="Course Code (e.g. CSE101)" required />
            <select name="status"><option>Active</option><option>Inactive</option></select>
            <button class="btn" type="submit">Add Course</button>
          </form>
        </section>

        <section class="cards" id="coursesList"></section>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/courses.js"></script>
  </body>
</html>
