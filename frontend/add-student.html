<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Student | Student Management</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">EduSaaS Admin</div>
        <a class="nav-item" href="/index.html">Dashboard</a>
        <a class="nav-item" href="/students.html">Students</a>
        <a class="nav-item active" href="/add-student.html">Add Student</a>
        <a class="nav-item" href="/courses.html">Courses</a>
        <a class="nav-item" href="/settings.html">Settings</a>
        <button class="nav-item" data-logout>Logout</button>
      </aside>
      <main class="main">
        <div class="topbar right-only">
          <div class="top-actions">
            <a class="btn alt" href="/signup.html">SignUp</a>
            <a class="btn alt" href="/login.html">Login</a>
            <button class="toggle" id="themeToggle"></button>
            <button class="btn danger" data-logout>Logout</button>
          </div>
        </div>
        <div class="page-title"><h2>Add Student</h2><div class="date-badge" id="dateBadge"></div></div>
        <section class="panel form-wrap">
          <form id="addStudentForm" enctype="multipart/form-data">
            <label>Profile Picture</label>
            <img src="https://via.placeholder.com/80" class="preview" id="imagePreview" alt="Preview" />
            <input type="file" id="profileImage" name="profileImage" accept="image/*" />
            <input type="text" name="name" placeholder="Full Name" required />
            <input type="email" name="email" placeholder="Email" required />
            <input type="number" name="age" placeholder="Age" required />
            <select name="course" id="courseSelect" required>
              <option value="">Select Course</option>
              <option value="No Course">No Course</option>
            </select>
            <select name="status">
              <option>Active</option>
              <option>Inactive</option>
            </select>
            <button class="btn" type="submit">Save Student</button>
          </form>
        </section>
      </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/addStudent.js"></script>
  </body>
</html>
